name: pqcscan
description: Find quantum-vulnerable cryptography (RSA, ECC, DH, weak hashes) and get post-quantum migration guidance.
branding:
  icon: shield
  color: purple
inputs:
  path:
    description: Directory to scan
    default: "."
  fail-on:
    description: Fail the job if any finding is at or above this severity (critical, high, medium, low, none)
    default: high
  sarif-file:
    description: Where to write the SARIF report
    default: pqcscan.sarif
  upload-sarif:
    description: Upload results to GitHub Code Scanning (needs security-events write permission)
    default: "true"
runs:
  using: composite
  steps:
    - uses: actions/setup-python@v5
      with:
        python-version: "3.12"
    - name: Install pqcscan
      shell: bash
      run: pip install --quiet "$GITHUB_ACTION_PATH"
    - name: Scan
      id: scan
      shell: bash
      env:
        SCAN_PATH: ${{ inputs.path }}
        FAIL_ON: ${{ inputs.fail-on }}
        SARIF_FILE: ${{ inputs.sarif-file }}
      run: |
        set +e
        pqcscan scan "$SCAN_PATH" --sarif "$SARIF_FILE" --fail-on "$FAIL_ON"
        echo "exit-code=$?" >> "$GITHUB_OUTPUT"
    - name: Upload SARIF
      if: inputs.upload-sarif == 'true'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.sarif-file }}
        category: pqcscan
    - name: Enforce threshold
      shell: bash
      run: exit ${{ steps.scan.outputs.exit-code }}
