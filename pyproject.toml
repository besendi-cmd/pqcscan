[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pqcscan"
version = "0.1.0"
description = "Find quantum-vulnerable cryptography in your codebase and plan the migration to post-quantum algorithms."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = ["cryptography>=42"]
keywords = ["post-quantum", "cryptography", "security", "sast", "pqc", "ml-kem", "ml-dsa"]

[project.optional-dependencies]
dashboard = ["fastapi>=0.110", "uvicorn>=0.29", "jinja2>=3.1"]
dev = ["pytest>=8", "cyclonedx-python-lib[json-validation]>=8", "httpx>=0.27", "pqcscan[dashboard]"]

[project.scripts]
pqcscan = "pqcscan.cli:main"

[tool.setuptools]
packages = ["pqcscan", "pqcscan.dashboard"]

[tool.setuptools.package-data]
"pqcscan.dashboard" = ["templates/*.html"]
